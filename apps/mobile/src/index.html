<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SKELIO Mobile - AI Biomechanics</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 16px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans safe-top safe-bottom select-none">

  <!-- Mobile Top Bar -->
  <header class="px-4 py-3 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center text-slate-950">
        <i data-lucide="activity" class="w-4 h-4 font-bold"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
          SKELIO Mobile
        </h1>
        <p class="text-[10px] text-slate-400 font-mono" id="server-status-pill">Connecting...</p>
      </div>
    </div>

    <!-- Quick Settings / Server IP Config -->
    <div class="flex items-center gap-2">
      <button onclick="promptServerHost()" class="p-2 rounded-xl bg-slate-800 text-slate-300 active:scale-95 transition-transform text-xs flex items-center gap-1">
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <span id="host-label" class="text-[11px] font-mono">Server</span>
      </button>
      <button id="btn-audio-mobile" onclick="toggleAudioMobile()" class="p-2 rounded-xl bg-slate-800 text-slate-400 active:scale-95 transition-transform">
        <i data-lucide="volume-2" id="icon-audio-mob" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Viewport Container -->
  <main class="flex-1 flex flex-col justify-center items-center p-3 relative overflow-hidden">
    
    <!-- Video Player Card -->
    <div class="w-full relative aspect-video sm:aspect-square max-h-[60vh] bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center">
      <img id="mobile-video-stream" src="" alt="SKELIO AI Camera" class="w-full h-full object-contain">

      <!-- Floating Mobile Overlay Card -->
      <div class="absolute top-2.5 left-2.5 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-lg border border-slate-700/60 text-[11px] font-mono flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        <span id="mob-mode-tag" class="text-cyan-300 font-bold">PUSH-UP</span>
        <span class="text-slate-500">|</span>
        <span id="mob-fps-tag" class="text-emerald-400">-- FPS</span>
      </div>

      <!-- Depth Indicator Bar (Right edge of screen) -->
      <div class="absolute right-2 top-3 bottom-3 w-3 bg-slate-900/80 rounded-full overflow-hidden p-0.5 border border-slate-700/60 flex flex-col justify-end">
        <div id="mob-depth-bar" class="w-full rounded-full bg-gradient-to-t from-rose-500 via-amber-400 to-emerald-400 transition-all duration-100" style="height: 0%;"></div>
      </div>
    </div>

    <!-- Mobile Telemetry Glance Bar -->
    <div class="w-full grid grid-cols-3 gap-2 mt-3 font-mono">
      <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-center">
        <span class="text-[10px] text-slate-400 block font-sans">REPETISI</span>
        <span id="mob-rep-count" class="text-3xl font-extrabold text-white">0</span>
      </div>
      <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-center">
        <span class="text-[10px] text-slate-400 block font-sans">SUDUT</span>
        <span id="mob-joint-angle" class="text-3xl font-extrabold text-cyan-400">0°</span>
      </div>
      <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-center">
        <span class="text-[10px] text-slate-400 block font-sans">KEDALAMAN</span>
        <span id="mob-depth-pct" class="text-3xl font-extrabold text-amber-400">0%</span>
      </div>
    </div>

    <!-- Live Posture Callout Banner -->
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-2 mt-2 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="shield-alert" class="w-4 h-4 text-purple-400"></i>
        <span id="mob-posture-status" class="text-xs font-bold text-emerald-400 truncate">POSISIKAN TUBUH</span>
      </div>
      <span id="mob-stage-pill" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">UP</span>
    </div>

  </main>

  <!-- Mobile Bottom Navigation Controls -->
  <footer class="p-3 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex flex-col gap-2">
    <!-- Exercise Mode Switcher (Scrollable horizontally) -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs font-semibold no-scrollbar">
      <button onclick="setMobileMode('PUSH-UP')" id="mob-btn-pushup" class="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold whitespace-nowrap active:scale-95 transition-all">
        Push-Up
      </button>
      <button onclick="setMobileMode('SQUAT')" id="mob-btn-squat" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 whitespace-nowrap active:scale-95 transition-all">
        Squat
      </button>
      <button onclick="setMobileMode('SIT-UP')" id="mob-btn-situp" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 whitespace-nowrap active:scale-95 transition-all">
        Sit-Up
      </button>
      <button onclick="setMobileMode('AUTO')" id="mob-btn-auto" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 whitespace-nowrap active:scale-95 transition-all">
        Auto
      </button>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="resetMobileReps()" class="py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold active:scale-95 transition-all flex items-center justify-center gap-1.5">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Reps
      </button>
      <button onclick="toggleMobileMetronome()" id="mob-metro-btn" class="py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold active:scale-95 transition-all flex items-center justify-center gap-1.5">
        <i data-lucide="timer" class="w-3.5 h-3.5"></i> Metronom (Off)
      </button>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    // Default server URL (bisa diubah sesuai IP laptop pengguna, misal: http://192.168.1.31:5000)
    let serverBaseUrl = localStorage.getItem('skelio_server_url') || window.location.origin;
    if (serverBaseUrl.startsWith('file:') || serverBaseUrl.includes('localhost') && window.location.protocol === 'file:') {
      serverBaseUrl = 'http://192.168.1.31:5000';
    }

    let audioEnabled = false;
    let lastSpokenRep = 0;
    let metroActive = false;
    let metroTimer = null;
    let metroStep = 0;

    function initStream() {
      const img = document.getElementById('mobile-video-stream');
      img.src = `${serverBaseUrl}/video_feed?t=${Date.now()}`;
      document.getElementById('server-status-pill').innerText = serverBaseUrl.replace('http://', '');
    }

    function promptServerHost() {
      const current = localStorage.getItem('skelio_server_url') || serverBaseUrl;
      const input = prompt("Masukkan Alamat Server SKELIO (IP Laptop & Port):\nContoh: http://192.168.1.31:5000", current);
      if (input && input.trim() !== "") {
        serverBaseUrl = input.trim();
        localStorage.setItem('skelio_server_url', serverBaseUrl);
        initStream();
      }
    }

    function speak(text) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'id-ID';
      u.rate = 1.1;
      window.speechSynthesis.speak(u);
    }

    function toggleAudioMobile() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('btn-audio-mobile');
      if (audioEnabled) {
        btn.classList.add('bg-cyan-500/20', 'border', 'border-cyan-500', 'text-cyan-400');
        speak("Suara aktif");
      } else {
        btn.classList.remove('bg-cyan-500/20', 'border', 'border-cyan-500', 'text-cyan-400');
      }
    }

    async function setMobileMode(mode) {
      try {
        await fetch(`${serverBaseUrl}/api/set_mode`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode })
        });
        ['pushup', 'squat', 'situp', 'auto'].forEach(m => {
          const b = document.getElementById(`mob-btn-${m}`);
          if (m === mode.toLowerCase().replace('-', '')) {
            b.className = "px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold whitespace-nowrap active:scale-95 transition-all";
          } else {
            b.className = "px-4 py-2 rounded-xl bg-slate-800 text-slate-300 whitespace-nowrap active:scale-95 transition-all";
          }
        });
        document.getElementById('mob-mode-tag').innerText = mode;
        speak("Mode " + mode);
      } catch (e) {
        console.error(e);
      }
    }

    async function resetMobileReps() {
      try {
        await fetch(`${serverBaseUrl}/api/reset_reps`, { method: 'POST' });
        speak("Reset");
      } catch (e) {}
    }

    function toggleMobileMetronome() {
      metroActive = !metroActive;
      const b = document.getElementById('mob-metro-btn');
      if (metroActive) {
        b.innerHTML = '<i data-lucide="timer" class="w-3.5 h-3.5"></i> Tempo 2-1-1';
        b.classList.add('bg-cyan-500/20', 'border-cyan-500', 'text-cyan-400');
        speak("Metronom aktif");
        metroStep = 0;
        metroTimer = setInterval(() => {
          metroStep = (metroStep + 1) % 4;
        }, 1000);
      } else {
        b.innerHTML = '<i data-lucide="timer" class="w-3.5 h-3.5"></i> Metronom (Off)';
        b.classList.remove('bg-cyan-500/20', 'border-cyan-500', 'text-cyan-400');
        clearInterval(metroTimer);
      }
      lucide.createIcons();
    }

    async function pollTelemetry() {
      try {
        const res = await fetch(`${serverBaseUrl}/api/telemetry`);
        const data = await res.json();
        
        document.getElementById('mob-fps-tag').innerText = `${data.fps} FPS`;
        const p = data.primary;
        if (p) {
          document.getElementById('mob-rep-count').innerText = p.rep_count;
          document.getElementById('mob-joint-angle').innerText = `${Math.round(p.primary_angle)}°`;
          document.getElementById('mob-depth-pct').innerText = `${Math.round(p.depth_pct)}%`;
          document.getElementById('mob-posture-status').innerText = p.status;
          document.getElementById('mob-stage-pill').innerText = p.stage;
          document.getElementById('mob-depth-bar').style.height = `${Math.min(100, p.depth_pct)}%`;

          if (p.rep_count > lastSpokenRep) {
            lastSpokenRep = p.rep_count;
            speak(p.rep_count.toString());
          }
        }
      } catch (e) {}
    }

    initStream();
    setInterval(pollTelemetry, 150);
  </script>
</body>
</html>
