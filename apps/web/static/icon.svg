<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skelio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="#0b0f19" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#skelio-grad)" stroke-width="6" opacity="0.4" />

  <!-- Kinetic Skeleton Biomechanics Graphic -->
  <g filter="url(#glow)">
    <!-- Head Keypoint -->
    <circle cx="256" cy="115" r="32" fill="url(#skelio-grad)" />

    <!-- Torso Spine Link -->
    <line x1="256" y1="147" x2="256" y2="280" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" />

    <!-- Shoulders -->
    <line x1="170" y1="190" x2="342" y2="190" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" />

    <!-- Left Arm (Elbow flexed) -->
    <line x1="170" y1="190" x2="115" y2="260" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
    <line x1="115" y1="260" x2="140" y2="330" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
    <circle cx="115" cy="260" r="14" fill="#facc15" />
    <circle cx="140" cy="330" r="12" fill="#10b981" />

    <!-- Right Arm -->
    <line x1="342" y1="190" x2="397" y2="260" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
    <line x1="397" y1="260" x2="372" y2="330" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
    <circle cx="397" cy="260" r="14" fill="#facc15" />
    <circle cx="372" cy="330" r="12" fill="#10b981" />

    <!-- Pelvis Hips -->
    <line x1="205" y1="280" x2="307" y2="280" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" />
    <circle cx="256" cy="280" r="16" fill="#06b6d4" />

    <!-- Left Leg (Knee & Ankle) -->
    <line x1="205" y1="280" x2="165" y2="380" stroke="#0891b2" stroke-width="14" stroke-linecap="round" />
    <line x1="165" y1="380" x2="190" y2="455" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
    <circle cx="165" cy="380" r="16" fill="#facc15" />
    <circle cx="190" cy="455" r="14" fill="#10b981" />

    <!-- Right Leg -->
    <line x1="307" y1="280" x2="347" y2="380" stroke="#0891b2" stroke-width="14" stroke-linecap="round" />
    <line x1="347" y1="380" x2="322" y2="455" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
    <circle cx="347" cy="380" r="16" fill="#facc15" />
    <circle cx="322" cy="455" r="14" fill="#10b981" />

    <!-- Kinematic Angle Arc overlay at knee -->
    <path d="M 148 350 A 28 28 0 0 1 185 365" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
